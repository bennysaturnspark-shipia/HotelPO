        const totalPOs = pos.length;

          totalBudget,

          variance: totalBudget - totalCommitted,

          delayedOrRisk,

            summaryMap[po.status].totalValue += (po.committedCost + po.freightCost + po.customsDuty);
            if (po.riskFlag) summaryMap[po.status].riskCount += 1;

        });

        return summaryMap;

                    </div>
                    <div>
                      <span className="text-[10px] text-slate-500 uppercase block">Freight & Duty</span>
                      <strong className="text-slate-800 font-bold">${(selectedPoModal.freightCost + selectedPoModal.customsDuty).toLocaleString()}</strong>
                    </div>
                    <div>
                      <span className="text-[10px] text-amber-700 font-bold uppercase block">Total Landed</span>
                      <strong className="text-amber-900 text-sm font-black">
                        ${(selectedPoModal.committedCost + selectedPoModal.freightCost + selectedPoModal.customsDuty).toLocaleString()}
                      </strong>
                    </div>
                  </div>

                  {/* Logistics Information */}
                  <div className="border-t border-slate-100 pt-4 space-y-2">
                    <h4 className="font-bold text-slate-900 text-sm">Shipping & Clearance Details</h4>
                    <div className="grid grid-cols-2 gap-2 text-slate-600">
                      <div><strong>Carrier:</strong> {selectedPoModal.carrier}</div>
                      <div><strong>Tracking/BOL:</strong> {selectedPoModal.trackingNo}</div>
                      <div><strong>Vessel/Flight:</strong> {selectedPoModal.vesselName}</div>
                      <div><strong>Port of Entry:</strong> {selectedPoModal.portOfEntry}</div>
                    </div>
                  </div>

                  {selectedPoModal.notes && (
                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-slate-600">
                      <strong className="text-slate-800 block mb-1">Inspector & Site Notes:</strong>
                      {selectedPoModal.notes}
                    </div>
                  )}
                </div>

                <div className="p-4 bg-slate-50 rounded-b-2xl border-t border-slate-200 flex justify-end">
                  <button
                    onClick={() => setSelectedPoModal(null)}
                    className="bg-slate-800 hover:bg-slate-700 text-white font-medium px-4 py-2 rounded-lg text-xs"
                  >
                    Close Window
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {/* CREATE NEW PO MODAL */}
          {showCreatePoModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto border border-slate-200">
                <div className="p-5 bg-hotel-navy text-white rounded-t-2xl flex justify-between items-center">
                  <h3 className="text-base font-bold">Issue New Hotel Purchase Order</h3>
                  <button onClick={() => setShowCreatePoModal(false)} className="text-slate-300 hover:text-white">
                    <IconBox name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const supId = formData.get('supplierId');
                    const supObj = suppliers.find(s => s.id === supId);

                    const newPo = {
                      id: `PO-2026-0${pos.length + 88}`,
                      poNumber: formData.get('poNumber') || `PO-2026-0${pos.length + 88}`,
                      title: formData.get('title'),
                      supplierId: supId,
                      supplierName: supObj ? supObj.name : 'Selected Vendor',
                      hotelZone: formData.get('hotelZone'),
                      category: formData.get('category'),
                      status: 'draft',
                      budgetCost: Number(formData.get('budgetCost')) || 0,
                      committedCost: Number(formData.get('committedCost')) || 0,
                      freightCost: Number(formData.get('freightCost')) || 0,
                      customsDuty: Number(formData.get('customsDuty')) || 0,
                      orderDate: new Date().toISOString().split('T')[0],
                      shipDate: formData.get('shipDate') || '2026-09-15',
                      etaDate: formData.get('etaDate') || '2026-10-01',
                      installTargetDate: formData.get('installTargetDate') || '2026-10-15',
                      carrier: formData.get('carrier') || 'Pending Logistics',
                      trackingNo: 'TBD',
                      vesselName: 'Pending Vessel Assignment',
                      portOfEntry: 'Port of Long Beach',
                      riskFlag: false,
                      notes: formData.get('notes') || 'Newly issued PO requisition.',
                      items: [
                        { name: formData.get('title'), qty: 1, unitPrice: Number(formData.get('committedCost')) || 0 }
                      ]
                    };

                    setPos([newPo, ...pos]);
                    setShowCreatePoModal(false);
                    triggerToast(`Created new Purchase Order ${newPo.poNumber}`);
                  }}
                  className="p-6 space-y-4 text-xs text-slate-700"
                >
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold block mb-1">PO Number</label>
                      <input
                        required
                        type="text"
                        name="poNumber"
                        defaultValue={`PO-2026-0${pos.length + 88}`}
                        className="w-full p-2 border border-slate-300 rounded-lg bg-slate-50 font-bold"
                      />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Select Supplier Profile</label>
                      <select name="supplierId" required className="w-full p-2 border border-slate-300 rounded-lg bg-white">
                        {suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="font-semibold block mb-1">PO Title / Scope of Delivery</label>
                    <input required type="text" name="title" placeholder="e.g. Guestroom Mini-Bar Refrigerators" className="w-full p-2 border border-slate-300 rounded-lg" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold block mb-1">Hotel Zone / Location</label>
                      <input required type="text" name="hotelZone" placeholder="e.g. Guestroom Tower A" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Category Tag</label>
                      <input required type="text" name="category" placeholder="e.g. FF&E, OS&E, IT/AV" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 border-t border-slate-100">
                    <div>
                      <label className="font-semibold block mb-1">Approved Budget ($)</label>
                      <input required type="number" name="budgetCost" placeholder="50000" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Base PO Cost ($)</label>
                      <input required type="number" name="committedCost" placeholder="48000" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Est. Freight ($)</label>
                      <input type="number" name="freightCost" defaultValue="3000" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Est. Duty ($)</label>
                      <input type="number" name="customsDuty" defaultValue="1500" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100">
                    <div>
                      <label className="font-semibold block mb-1">Ex-Factory Ship Date</label>
                      <input type="date" name="shipDate" defaultValue="2026-09-15" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Port ETA</label>
                      <input type="date" name="etaDate" defaultValue="2026-10-01" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Install Target Date</label>
                      <input type="date" name="installTargetDate" defaultValue="2026-10-15" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                  </div>

                  <div>
                    <label className="font-semibold block mb-1">Preferred Carrier / Logistics Partner</label>
                    <input type="text" name="carrier" placeholder="e.g. Kuehne+Nagel / DHL Freight" className="w-full p-2 border border-slate-300 rounded-lg" />
                  </div>

                  <div>
                    <label className="font-semibold block mb-1">Notes / Installation Specs</label>
                    <textarea name="notes" rows="2" placeholder="Special handling or staging instructions..." className="w-full p-2 border border-slate-300 rounded-lg"></textarea>
                  </div>

                  <div className="pt-3 border-t border-slate-200 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowCreatePoModal(false)} className="px-4 py-2 rounded-lg bg-slate-100 text-slate-700">Cancel</button>
                    <button type="submit" className="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold">Generate PO Requisition</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {/* CREATE NEW SUPPLIER MODAL */}
          {showCreateSupplierModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full border border-slate-200">
                <div className="p-5 bg-hotel-navy text-white rounded-t-2xl flex justify-between items-center">
                  <h3 className="text-base font-bold">Register New Supplier Profile</h3>
                  <button onClick={() => setShowCreateSupplierModal(false)} className="text-slate-300 hover:text-white">
                    <IconBox name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const newSup = {
                      id: `SUP-00${suppliers.length + 1}`,
                      name: formData.get('name'),
                      category: formData.get('category'),
                      contact: formData.get('contact'),
                      email: formData.get('email'),
                      phone: formData.get('phone'),
                      rating: 4.5,
                      location: formData.get('location'),
                      leadTimeAvg: formData.get('leadTimeAvg') || '30 Days',
                      status: 'Approved'
                    };

                    setSuppliers([...suppliers, newSup]);
                    setShowCreateSupplierModal(false);
                    triggerToast(`Added vendor profile: ${newSup.name}`);
                  }}
                  className="p-6 space-y-3 text-xs text-slate-700"
                >
                  <div>
                    <label className="font-semibold block mb-1">Company / Supplier Name</label>
                    <input required type="text" name="name" placeholder="e.g. Regency Marble & Tile Co." className="w-full p-2 border border-slate-300 rounded-lg" />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">Product Category</label>
                    <input required type="text" name="category" placeholder="e.g. Flooring & Stonework" className="w-full p-2 border border-slate-300 rounded-lg" />
                  </div>
                  <div>
                    <label className="font-semibold block mb-1">Primary Representative Contact</label>
                    <input required type="text" name="contact" placeholder="e.g. Robert Smith" className="w-full p-2 border border-slate-300 rounded-lg" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold block mb-1">Email</label>
                      <input required type="email" name="email" placeholder="rsmith@vendor.com" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Phone</label>
                      <input required type="text" name="phone" placeholder="+1 (555) 000-0000" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold block mb-1">Factory Location</label>
                      <input required type="text" name="location" placeholder="e.g. Verona, Italy" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Avg Lead Time</label>
                      <input type="text" name="leadTimeAvg" placeholder="e.g. 45 Days" className="w-full p-2 border border-slate-300 rounded-lg" />
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowCreateSupplierModal(false)} className="px-4 py-2 rounded-lg bg-slate-100 text-slate-700">Cancel</button>
                    <button type="submit" className="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold">Save Supplier Profile</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
